<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tamil Music Player</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1c1c1c;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #aaa;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            padding-bottom: 180px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        .search:focus {
            border-color: #777;
        }

        .song {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1d1d1d;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .song:hover {
            background: #292929;
        }

        .song-number {
            width: 35px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-size: 17px;
            font-weight: bold;
        }

        .song-subtitle {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .play-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: white;
            color: black;
            font-size: 18px;
            cursor: pointer;
        }

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #333;
            padding: 15px;
            z-index: 100;
        }

        .player-inner {
            max-width: 900px;
            margin: auto;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            margin: 8px 0;
        }

        #progress {
            width: 100%;
            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 12px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 8px;
        }

        .control-button {
            border: none;
            background: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .main-play {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .volume {
            width: 100px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 23px;
            }

            .container {
                padding: 15px;
                padding-bottom: 190px;
            }

            .song {
                padding: 12px;
            }

            .volume {
                width: 70px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎵 My Tamil Music Player</h1>
        <p>My personal music collection</p>
    </header>

    <main class="container">

        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔍 Search songs..."
        >

        <div id="songList"></div>

    </main>


    <!-- MUSIC PLAYER -->

    <div class="player">

        <div class="player-inner">

            <div class="now-playing" id="nowPlaying">
                Select a song
            </div>

            <div class="progress-container">

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <div class="time">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>

            </div>

            <div class="controls">

                <button
                    class="control-button"
                    onclick="previousSong()">
                    ⏮
                </button>

                <button
                    class="main-play"
                    id="playButton"
                    onclick="playPause()">
                    ▶
                </button>

                <button
                    class="control-button"
                    onclick="nextSong()">
                    ⏭
                </button>

                <input
                    class="volume"
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>

        </div>

    </div>


    <!-- AUDIO -->

    <audio id="audio"></audio>


    <script>

        /* =========================================
           SONG LIST
           ========================================= */

        const songs = [

            {
                title: "Ratnamala",
                movie: "Tamil Song",
                url: "https://zjrordthseykjkreznei.supabase.co/storage/v1/object/public/Music/Ratnamala.mp3"
            }

        ];


        /* =========================================
           VARIABLES
           ========================================= */

        let currentSong = 0;

        const audio = document.getElementById("audio");

        const songList = document.getElementById("songList");

        const nowPlaying = document.getElementById("nowPlaying");

        const playButton = document.getElementById("playButton");

        const progress = document.getElementById("progress");

        const currentTimeText =
            document.getElementById("currentTime");

        const durationText =
            document.getElementById("duration");

        const volume =
            document.getElementById("volume");

        const search =
            document.getElementById("search");


        /* =========================================
           SHOW SONGS
           ========================================= */

        function displaySongs(list = songs) {

            songList.innerHTML = "";

            if (list.length === 0) {

                songList.innerHTML =
                    '<div class="empty">No songs found</div>';

                return;
            }

            list.forEach((song, index) => {

                const realIndex = songs.indexOf(song);

                const div = document.createElement("div");

                div.className = "song";

                div.innerHTML = `

                    <div class="song-number">
                        ${index + 1}
                    </div>

                    <div class="song-info">

                        <div class="song-title">
                            ${song.title}
                        </div>

                        <div class="song-subtitle">
                            ${song.movie}
                        </div>

                    </div>

                    <button
                        class="play-button"
                        onclick="playSong(${realIndex})">

                        ▶

                    </button>

                `;

                div.onclick = function(e) {

                    if (e.target.tagName !== "BUTTON") {
                        playSong(realIndex);
                    }

                };

                songList.appendChild(div);

            });

        }


        /* =========================================
           PLAY SONG
           ========================================= */

        function playSong(index) {

            currentSong = index;

            const song = songs[currentSong];

            audio.src = song.url;

            nowPlaying.innerText =
                "🎵 " + song.title;

            audio.play()
                .then(() => {

                    playButton.innerText = "⏸";

                })
                .catch(error => {

                    console.log(error);

                    alert(
                        "Song could not be played."
                    );

                });

        }


        /* =========================================
           PLAY / PAUSE
           ========================================= */

        function playPause() {

            if (!audio.src) {

                playSong(currentSong);

                return;

            }

            if (audio.paused) {

                audio.play();

                playButton.innerText = "⏸";

            } else {

                audio.pause();

                playButton.innerText = "▶";

            }

        }


        /* =========================================
           PREVIOUS
           ========================================= */

        function previousSong() {

            if (currentSong > 0) {

                currentSong--;

            } else {

                currentSong = songs.length - 1;

            }

            playSong(currentSong);

        }


        /* =========================================
           NEXT
           ========================================= */

        function nextSong() {

            if (currentSong < songs.length - 1) {

                currentSong++;

            } else {

                currentSong = 0;

            }

            playSong(currentSong);

        }


        /* =========================================
           SEARCH
           ========================================= */

        search.addEventListener("input", function() {

            const text =
                search.value.toLowerCase();

            const filtered =
                songs.filter(song =>

                    song.title
                        .toLowerCase()
                        .includes(text)

                    ||

                    song.movie
                        .toLowerCase()
                        .includes(text)

                );

            displaySongs(filtered);

        });


        /* =========================================
           AUDIO PROGRESS
           ========================================= */

        audio.addEventListener(
            "timeupdate",
            function() {

                if (!audio.duration) return;

                const percent =
                    (audio.currentTime /
                    audio.duration) * 100;

                progress.value = percent;

                currentTimeText.innerText =
                    formatTime(audio.currentTime);

            }
        );


        /* =========================================
           AUDIO LOADED
           ========================================= */

        audio.addEventListener(
            "loadedmetadata",
            function() {

                durationText.innerText =
                    formatTime(audio.duration);

            }
        );


        /* =========================================
           SONG ENDED
           ========================================= */

        audio.addEventListener(
            "ended",
            function() {

                nextSong();

            }
        );


        /* =========================================
           PROGRESS BAR
           ========================================= */

        progress.addEventListener(
            "input",
            function() {

                if (!audio.duration) return;

                audio.currentTime =
                    (progress.value / 100)
                    * audio.duration;

            }
        );


        /* =========================================
           VOLUME
           ========================================= */

        volume.addEventListener(
            "input",
            function() {

                audio.volume =
                    volume.value;

            }
        );


        /* =========================================
           TIME FORMAT
           ========================================= */

        function formatTime(seconds) {

            if (isNaN(seconds)) {
                return "0:00";
            }

            const minutes =
                Math.floor(seconds / 60);

            const secs =
                Math.floor(seconds % 60);

            return minutes + ":" +
                (secs < 10 ? "0" : "") +
                secs;

        }


        /* =========================================
           INITIAL LOAD
           ========================================= */

        displaySongs();

    </script>

</body>

</html>
